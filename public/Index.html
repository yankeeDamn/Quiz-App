<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Practice Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sign-In View -->
    <div id="signin-container">
        <div id="signin-box">
            <div id="signin-logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Exam Practice Pro</span>
            </div>
            <h2>Sign In to Your Account</h2>
            <p class="signin-subtitle">Access certification exam practice tests</p>

            <div id="signin-error" class="signin-error" style="display:none;"></div>

            <form id="signin-form" novalidate>
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="Your password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="signin-btn" class="btn-primary">Sign In</button>
            </form>

            <div class="signin-divider"><span>or</span></div>

            <button id="guest-btn" class="btn-guest">Continue as Guest</button>

            <p class="signin-footer">
                Don't have an account? <a href="#" id="signup-link">Sign up for free</a>
            </p>
        </div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" style="display:none;">
        <header id="app-header">
            <div class="header-left">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Exam Practice Pro</span>
            </div>
            <div class="header-right">
                <span id="user-display"></span>
                <button id="signout-btn" class="btn-signout">Sign Out</button>
            </div>
        </header>

        <div id="quiz-container">
            <div id="quiz-header">
                <h1 id="quiz-title">Practice Quiz</h1>
                <div id="timer-box">
                    <span class="timer-label">Time Remaining</span>
                    <span id="timer-display">30:00</span>
                </div>
            </div>

            <form id="quiz-form">
                <!-- Questions will be dynamically loaded here -->
            </form>

            <div id="quiz-actions">
                <button id="start-payment" class="btn-primary">Submit Quiz &amp; Pay</button>
            </div>
        </div>

        <!-- Results Panel (shown after submission) -->
        <div id="results-container" style="display:none;">
            <h2>Quiz Results</h2>
            <p id="results-score"></p>
            <button id="retake-btn" class="btn-primary">Retake Quiz</button>
            <button id="proceed-payment-btn" class="btn-primary">Get Full Access</button>
        </div>

        <div id="payment-container" style="display:none;">
            <h2>Complete Payment</h2>
            <p>Unlock unlimited practice exams for <strong>$50</strong></p>
            <form id="payment-form">
                <div id="card-element"></div>
                <button id="submit-payment" class="btn-primary">Pay Now</button>
            </form>
        </div>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script src="script.js"></script>
</body>
</html>
