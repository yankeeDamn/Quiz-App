# ExamPro: deploy only the existing Express backend to Render.
# Next.js stays on Vercel. PostgreSQL is an EXTERNAL Neon project.
# Do not provision a duplicate Render frontend or PostgreSQL database.
services:
  - type: web
    name: exampro-api
    runtime: node
    buildCommand: npm ci --omit=dev && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
