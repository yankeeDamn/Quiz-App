# ──────────────────────────────────────────────
# Exam Practice Pro — CI/CD Pipeline
# ──────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Lint & Test ─────────────────────
  backend:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          AUTH_SECRET: ci-test-auth-secret
          ADMIN_API_KEY: ci-test-admin-key-0123456789abcdef

  # ── Frontend: Build ──────────────────────────
  frontend:
    name: Frontend – Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exam-practice-pro/package-lock.json

      - name: Install dependencies
        working-directory: exam-practice-pro
        run: npm ci

      - name: Build Next.js app
        working-directory: exam-practice-pro
        run: npm run build
        env:
          AUTH_SECRET: ci-test-auth-secret
          NEXT_PUBLIC_API_URL: http://localhost:3001

  ebooks-postgres:
    name: Ebook permissions, migrations and grading (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ebook-ci-only
          POSTGRES_DB: ebook_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ebook-ci-only@localhost:5432/ebook_tests
      EBOOK_TEST_DATABASE_URL: postgresql://postgres:ebook-ci-only@localhost:5432/ebook_tests
      AUTH_SECRET: ebook-integration-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply additive migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Test real OAuth middleware, ACLs and persisted results
        run: node --test test/ebooks-postgres.integration.js

  # ── Docker Build ──────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t exam-practice-pro-api .

      - name: Verify container starts
        run: |
          docker run -d --name test-api \
            -e NODE_ENV=development \
            -e JWT_SECRET=ci-test-secret \
            -e AUTH_SECRET=ci-test-auth-secret \
            -p 3000:3000 \
            exam-practice-pro-api

          sleep 5

          # Health check
          curl -f http://localhost:3000/health || exit 1

          docker stop test-api
          docker rm test-api
