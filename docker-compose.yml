# ──────────────────────────────────────────────
# Exam Practice Pro — Local Development Stack
# ──────────────────────────────────────────────
# Usage:
#   docker compose up            — start the API + database
#   docker compose up --build    — rebuild & start
#   docker compose down          — stop everything
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_practice_pro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_practice_pro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://exam_user:exam_password@db:5432/exam_practice_pro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
